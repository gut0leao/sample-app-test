name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Record runtime dependency tree
        run: |
          mvn --batch-mode --no-transfer-progress -pl sample-app org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=runtime -DoutputFile=target/dependency-tree.txt
          cat sample-app/target/dependency-tree.txt
          grep -F 'io.github.gut0leao:sample-logging:jar:' sample-app/target/dependency-tree.txt
          grep -F 'org.apache.logging.log4j:log4j-core:jar:2.14.1:compile' sample-app/target/dependency-tree.txt
          grep -F 'org.apache.logging.log4j:log4j-api:jar:2.14.1:compile' sample-app/target/dependency-tree.txt
      - name: Verify and stage release files
        run: |
          python3 scripts/verify-artifacts.py
          java -jar sample-app/target/sample-app-1.0.0-all.jar > /tmp/sample-output.txt
          printf 'Hello from sample-app!\n' > /tmp/sample-expected.txt
          diff -u /tmp/sample-expected.txt /tmp/sample-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')
          test "$TAG" = "v$VERSION"
          test -f ".github/release-notes/$TAG.md"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file ".github/release-notes/$TAG.md"
      - name: Validate published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir downloaded
          cd downloaded
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
